name: SUBÜ Duyuru Botu

on:
  schedule:
    # GitHub Actions cron UTC saatine göre çalışır.
    # Türkiye saati (UTC+3) 08:00–17:00 => UTC 05:00–14:00, her saat başı.
    - cron: "0 5-14 * * *"
  workflow_dispatch: {}   # Elle test için manuel tetikleme

# seen.json dosyasını repoya geri commit edebilmek için yazma izni
permissions:
  contents: write

concurrency:
  group: duyuru-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Durumu kaydet (seen.json)
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: duyuru durumunu güncelle [skip ci]"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
