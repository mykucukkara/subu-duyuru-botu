name: SUBÜ Duyuru Botu

on:
  # Zamanlama cron-job.org tarafından dışarıdan yapılıyor (GitHub cron'u güvenilmez
  # olduğu ve çift çalışma/dakika israfı yarattığı için kaldırıldı).
  # cron-job.org, TR 08:00-17:00 arası her yarım saatte bu workflow'u tetikler.
  workflow_dispatch: {}

# seen.json dosyasını repoya geri commit edebilmek için yazma izni
permissions:
  contents: write

concurrency:
  group: duyuru-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Durumu kaydet (seen.json)
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: duyuru durumunu güncelle [skip ci]"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
