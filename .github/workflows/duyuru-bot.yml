name: SUBÜ Duyuru Botu

on:
  # Zamanlama cron-job.org tarafından dışarıdan yapılıyor (GitHub cron'u güvenilmez
  # olduğu ve çift çalışma/dakika israfı yarattığı için kaldırıldı).
  # cron-job.org, TR 08:00-17:00 arası her yarım saatte bu workflow'u tetikler.
  workflow_dispatch: {}

# seen.json dosyasını repoya geri commit edebilmek için yazma izni
permissions:
  contents: write

concurrency:
  group: duyuru-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu klonla
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Durumu kaydet (seen.json)
        run: |
          if [[ -z "$(git status --porcelain seen.json)" ]]; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: duyuru durumunu güncelle [skip ci]"
          # Eşzamanlı çalışmalar remote'u ilerletmiş olabilir; push reddedilirse
          # remote seen.json ile birleştirip tekrar dene (en çok 5 kez).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push başarılı (deneme $i)"
              exit 0
            fi
            echo "push $i reddedildi; remote ile birleştiriliyor..."
            git fetch origin main
            git show origin/main:seen.json > /tmp/remote_seen.json 2>/dev/null || echo '{}' > /tmp/remote_seen.json
            python merge_seen.py seen.json /tmp/remote_seen.json
            git reset --soft origin/main
            git add seen.json
            git commit -m "chore: duyuru durumunu güncelle [skip ci]"
          done
          echo "HATA: push 5 denemede başarısız" >&2
          exit 1
